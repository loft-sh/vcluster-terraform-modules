name: OpenTofu CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tftest.hcl'
      - '.github/workflows/test.yml'
      - '.terraform-docs.yml'
      - '.tflint.hcl'

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - vcluster
          - vcluster-kubeconfig
          - vcluster-platform-registration
          - single-namespace-rename
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ matrix.directory }}
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - _shared/platform-context
          - vcluster
          - vcluster-kubeconfig
          - vcluster-platform-registration
          - single-namespace-rename
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12
        with:
          directory: ${{ matrix.directory }}
          framework: terraform

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - _shared/platform-context
          - vcluster
          - vcluster-kubeconfig
          - vcluster-platform-registration
          - single-namespace-rename
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: TFLint
        working-directory: ${{ matrix.directory }}
        run: tflint

  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - _shared/platform-context
          - vcluster
          - vcluster-kubeconfig
          - vcluster-platform-registration
          # single-namespace-rename uses configuration_aliases and cannot be
          # validated standalone. Use the wrapper module that provides the alias.
          - single-namespace-rename/tests/validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Init
        working-directory: ${{ matrix.directory }}
        run: tofu init -backend=false
      - name: OpenTofu Validate
        working-directory: ${{ matrix.directory }}
        run: tofu validate

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - _shared/platform-context
          - vcluster
          - vcluster-kubeconfig
          - vcluster-platform-registration
          - single-namespace-rename
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.9"
      - name: OpenTofu Init
        working-directory: ${{ matrix.directory }}
        run: tofu init -backend=false
      - name: OpenTofu Test
        working-directory: ${{ matrix.directory }}
        run: tofu test -no-color
